<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#09131b"><title>REGNAXIS</title><style>:root{--bg:#09131b;--cyan:#8ae5d9;--gold:#d8c29b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="game"></canvas><script>if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(async registrations=>{for(const registration of registrations)if(registration.scope.endsWith('/REGNAXIS/'))await registration.unregister();await caches.delete('regnaxis-shell-v1');if(navigator.serviceWorker.controller&&!sessionStorage.getItem('regnaxis-cache-cleared')){sessionStorage.setItem('regnaxis-cache-cleared','1');location.reload();}});}</script><script type="module" src="./src/main.js?v=minimal-2"></script></body></html>
